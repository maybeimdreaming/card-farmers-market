# Builds Card Farmer's Market for Linux, Windows and macOS, checks each build really opens its window and
# talks to the farm, and on a v* tag publishes them as a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp the version (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION = \"$GITHUB_REF_NAME\"" > cardfarm/_version.py
      - run: pip install pytest && python -m pytest tests -q
      - run: python packaging/build.py linux
      - name: The idler child starts from inside the .pyz
        run: |
          set +e; python3 dist/card-farmers-market.pyz --idle-child /no/such/library; code=$?; set -e
          test "$code" = 2
          cmp dist/card-farmers-market.pyz dist/card-farm.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/card-farmers-market.pyz
            dist/card-farm.pyz

  windows:
    timeout-minutes: 5
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stamp the version (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION = \"$GITHUB_REF_NAME\"" > cardfarm/_version.py
      - run: pip install pytest pyinstaller pywebview pillow
      - run: python -m pytest tests -q
      - run: python packaging/build.py windows
      # the program itself stays unmarked: a marked exe gets SmartScreen's "unknown publisher"
      # prompt, which a person clicks through (Run anyway) but would hang this unattended check
      - name: Mark the build as downloaded, like a browser does
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File "dist\Card Farmer's Market" | Where-Object Name -ne "Card Farmer's Market.exe" | ForEach-Object {
            Set-Content -Path $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          if (-not (Get-Item "dist\Card Farmer's Market\_internal\pythonnet\runtime\Python.Runtime.dll" -Stream Zone.Identifier -ErrorAction SilentlyContinue)) { throw "mark not applied" }
      - name: The built app opens its window and shows the sign-in page
        shell: pwsh
        run: |
          $env:CARD_FARM_DATA = "$env:RUNNER_TEMP\cf-data"
          $env:CARD_FARM_SELFTEST = "$env:RUNNER_TEMP\selftest.json"
          $p = Start-Process -FilePath "dist\Card Farmer's Market\Card Farmer's Market.exe" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "the window didn't finish its self-test" }
          Get-Content $env:CARD_FARM_SELFTEST
          if (-not (Get-Content $env:CARD_FARM_SELFTEST | ConvertFrom-Json).ok) { throw "self-test failed" }
      - name: The idler child starts from the built app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Card Farmer's Market\Card Farmer's Market.exe" -ArgumentList "--idle-child","C:\no\such\steam_api64.dll" -PassThru -Wait
          if ($p.ExitCode -ne 2) { throw "idler child exit code $($p.ExitCode)" }
      - name: The old-name download holds the old names and runs
        shell: pwsh
        run: |
          Expand-Archive dist\Card-Farm-Windows.zip "$env:RUNNER_TEMP\old"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\old\Card Farm\Card Farm.exe" -ArgumentList "--idle-child","C:\no\such\steam_api64.dll" -PassThru -Wait
          if ($p.ExitCode -ne 2) { throw "old-name idler child exit code $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Card-Farmers-Market-Windows.zip
            dist/Card-Farm-Windows.zip

  macos:
    # one app for both kinds of Mac, built on an Intel Mac: GitHub's Apple silicon machines are often
    # too busy to get (jobs waited 15 min and were dropped), its Intel ones aren't
    timeout-minutes: 8
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Python with Apple silicon and Intel code (python.org's universal2 build)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          echo "8373e58da4ea146b3eb1c1f9834f19a319440b6b679b06050b1f9ee3237aa8e4  $RUNNER_TEMP/python.pkg" | shasum -a 256 -c
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Stamp the version (tag builds)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "VERSION = \"$GITHUB_REF_NAME\"" > cardfarm/_version.py
      - run: pip install pytest pyinstaller pywebview pillow
      - run: python -m pytest tests -q
      - run: python packaging/build.py macos
      - name: The built app opens its window and shows the sign-in page
        run: |
          export CARD_FARM_DATA="$RUNNER_TEMP/cf-data" CARD_FARM_SELFTEST="$RUNNER_TEMP/selftest.json"
          "dist/Card Farmer's Market.app/Contents/MacOS/Card Farmer's Market" &
          pid=$!
          for i in $(seq 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && { echo "the window didn't finish its self-test"; exit 1; }
          cat "$CARD_FARM_SELFTEST"
          python3 -c "import json,sys; sys.exit(0 if json.load(open('$CARD_FARM_SELFTEST'))['ok'] else 1)"
      - name: The idler child starts from the built app
        run: |
          set +e; "dist/Card Farmer's Market.app/Contents/MacOS/Card Farmer's Market" --idle-child /no/such/libsteam_api.dylib; code=$?; set -e
          test "$code" = 2
          set +e; "dist/Card Farm.app/Contents/MacOS/Card Farmer's Market" --idle-child /no/such/libsteam_api.dylib; code=$?; set -e
          test "$code" = 2
      - name: The app's signature is intact
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Card Farmer's Market.app"
          codesign --verify --deep --strict "dist/Card Farm.app"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/Card-Farmers-Market-macOS.zip
            dist/Card-Farmers-Market-macOS-Intel.zip
            dist/Card-Farm-macOS.zip
            dist/Card-Farm-macOS-Intel.zip

  macos-apple-silicon:
    # the same app opened on an Apple silicon Mac, when GitHub has one free; the release doesn't wait for it
    needs: macos
    timeout-minutes: 5
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
      - name: The app opens its window and shows the sign-in page
        run: |
          ditto -x -k Card-Farmers-Market-macOS.zip .
          export CARD_FARM_DATA="$RUNNER_TEMP/cf-data" CARD_FARM_SELFTEST="$RUNNER_TEMP/selftest.json"
          test "$(uname -m)" = arm64
          "Card Farmer's Market.app/Contents/MacOS/Card Farmer's Market" &
          pid=$!
          for i in $(seq 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && { echo "the window didn't finish its self-test"; exit 1; }
          cat "$CARD_FARM_SELFTEST"
          python3 -c "import json,sys; sys.exit(0 if json.load(open('$CARD_FARM_SELFTEST'))['ok'] else 1)"
          codesign --verify --deep --strict "Card Farmer's Market.app"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # a release published early (before a slow macOS queue) just gets the remaining files
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
          else
            # tags like v0.2.0-beta.4 are pre-releases
            gh release create "$GITHUB_REF_NAME" out/* --title "Card Farmer's Market ${GITHUB_REF_NAME#v}" --notes-file packaging/release-notes.md \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          fi
