name: An idea
description: Something Card Farmer's Market could do, or do better
labels: ["idea"]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like it to do, and what would it save you?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it now
      description: Optional - another tool, by hand on the Steam website, or not at all.
